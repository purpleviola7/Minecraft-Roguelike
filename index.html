<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Roguelike - Grid Edition</title>
    <style>
        @import url('https://googleapis.com');

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #141414;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            line-height: 1.6;
        }

        h1 {
            color: #55ff55;
            text-shadow: 3px 3px #003300;
            font-size: 1.6rem;
            margin-bottom: 2px;
            text-align: center;
        }

        .subtitle {
            font-size: 9px;
            color: #aaa;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #2c2c2c;
            padding: 15px;
            border: 4px solid #1e1e1e;
            box-shadow: inset -4px -4px #111, inset 4px 4px #555;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .hearts-container {
            display: inline-flex;
            gap: 2px;
            flex-wrap: wrap;
            max-width: 320px;
        }
        .heart {
            width: 14px;
            height: 14px;
            background-color: #ff2222;
            position: relative;
            transform: rotate(-45deg);
            margin: 6px 4px 0 4px;
            display: inline-block;
            box-shadow: inset -2px -2px #aa0000;
        }
        .heart:before, .heart:after {
            content: "";
            width: 14px;
            height: 14px;
            background-color: #ff2222;
            border-radius: 50%;
            position: absolute;
            box-shadow: inset -2px -2px #aa0000;
        }
        .heart:before { top: -7px; left: 0; }
        .heart:after { top: 0; left: 7px; }
        
        .heart.empty { background-color: #444 !important; box-shadow: none; }
        .heart.empty:before, .heart.empty:after { background-color: #444 !important; box-shadow: none; }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151515;
            padding: 12px;
            border: 3px solid #333;
            margin-bottom: 15px;
        }

        /* Upgraded Currency Typography Readouts */
        .currency-display-panel {
            text-align: right; 
            font-size: 13px;
            letter-spacing: 0.5px;
            line-height: 1.8;
        }
        .emerald-text { color: #55ff55; font-weight: bold; }
        .gold-text { color: #ffaa00; font-weight: bold; }
        
        .vault-container-label {
            margin-top: 6px; 
            border-top: 2px solid #444; 
            padding-top: 5px; 
            font-size: 11px;
            color: #aaa;
        }

        .map-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 55px);
            grid-template-rows: repeat(5, 55px);
            gap: 4px;
            background: #111;
            padding: 6px;
            border: 4px solid #444;
        }
        .cell {
            background-color: #222;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            position: relative;
            image-rendering: pixelated;
        }
        .cell.unexplored { background-color: #1a1a1a; border-color: #222; }
        .cell.player { background-color: #5555ff !important; border-color: #7777ff; box-shadow: inset -4px -4px #3333cc; }
        .cell.tunnel { background-color: #555; border-color: #777; box-shadow: inset -4px -4px #333; }
        .cell.mob { background-color: #3d2d2d; border-color: #ff5555; }
        .cell.heal { background-color: #2d3d2d; border-color: #55ff55; }
        .cell.chest { background-color: #4a3319; border-color: #ffaa00; }

        .btn {
            font-family: 'Press Start 2P', monospace;
            background-color: #4a4a4a;
            color: #e0e0e0;
            border: 3px solid #000;
            padding: 10px 15px;
            font-size: 10px;
            cursor: pointer;
            box-shadow: inset -3px -3px #222, inset 3px 3px #777;
            margin: 5px;
            text-transform: uppercase;
        }
        .btn:hover { background-color: #5a5a5a; color: #fff; }
        .btn:active { box-shadow: inset 3px 3px #222, inset -3px -3px #777; padding-top: 11px; padding-bottom: 9px; }
        .btn:disabled { background-color: #222; color: #555; box-shadow: none; cursor: not-allowed; }
        .btn-action { background-color: #00aa00; box-shadow: inset -3px -3px #006600, inset 3px 3px #55ff55; color: #fff; }
        .btn-action:hover { background-color: #00bf00; }
        .btn-danger { background-color: #aa0000; box-shadow: inset -3px -3px #660000, inset 3px 3px #ff5555; color: #fff; }
        .btn-danger:hover { background-color: #cc0000; }

        .log-container {
            background: #000;
            border: 3px solid #444;
            padding: 12px;
            height: 90px;
            overflow-y: auto;
            color: #aaa;
            font-size: 8px;
            text-transform: uppercase;
        }

        .combat-overlay, .card-overlay {
            background: #331111;
            border: 4px solid #ff5555;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
        .card-overlay {
            background: #1a2a1a;
            border-color: #55ff55;
        }
        .cards-row-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .upgrade-card {
            background: #2c3e2c;
            border: 3px solid #55ff55;
            padding: 10px;
            width: 140px;
            cursor: pointer;
            box-shadow: inset -3px -3px #1a2a1a, inset 3px 3px #77ff77;
        }
        .upgrade-card:hover {
            background: #3d553d;
        }
        .card-title {
            font-size: 8px;
            color: #ffaa00;
            margin-bottom: 6px;
        }
        .card-desc {
            font-size: 7px;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>⛏️ MINECRAFT ROGUELIKE</h1>
    <div class="subtitle">Procedural Screen Map Mod</div>

    <div class="container">
        <div class="stats-row">
            <div>
                <span style="display:block; font-size:8px; margin-bottom:4px; color:#aaa;" id="dmg-label">ATK: 1-6 | HP POOL</span>
                <div class="hearts-container" id="hearts-box"></div>
            </div>
            <div class="currency-display-panel">
                <div>RUN EME: <span id="run-emeralds" class="emerald-text">0</span> 🟢</div>
                <div>RUN GLD: <span id="run-gold" class="gold-text">0</span> 🟡</div>
                <div class="vault-container-label">
                    VAULT EME: <span id="vault-emeralds" class="emerald-text">0</span> 🟢
                </div>
            </div>
        </div>

        <div class="map-wrapper">
            <div class="grid" id="map-grid"></div>
        </div>

        <div id="action-area" style="text-align: center;">
            <button class="btn btn-action" id="explore-btn" onclick="movePlayer()">Mine Next Chunk</button>
        </div>

        <div class="combat-overlay" id="combat-zone">
            <div id="mob-avatar" style="font-size:32px; margin-bottom:10px;"></div>
            <h3 id="mob-title" style="color: #ff5555; margin: 0 0 10px 0; font-size:12px;">MOB DETECTED</h3>
            <p id="mob-stats" style="font-size:9px; margin-bottom:15px;"></p>
            <button class="btn btn-danger" onclick="attackMob()">Strike Target</button>
        </div>

        <div class="card-overlay" id="chest-zone">
            <div style="font-size:32px; margin-bottom:5px;">📦</div>
            <h3 style="color: #55ff55; margin: 0 0 5px 0; font-size:11px;">MINECRAFT LOOT CHEST</h3>
            <p style="font-size:8px; color:#aaa; margin:0;">CHOOSE ONE PERK CARD TO EQUIP:</p>
            <div class="cards-row-wrapper" id="cards-container"></div>
        </div>

        <p style="font-size:8px; color:#aaa; margin: 15px 0 5px 2px;">COMMUNICATION LOG:</p>
        <div class="log-container" id="log">Ready to explore chunk (0,0). Let's dig!</div>
    </div>

    <script>
        // Global Game State Variables
        let hp = 10;
        let maxHp = 10;
        let bonusDamage = 0;
        let runEmeralds = 0;
        let runGold = 0;
        let vaultEmeralds = 0;
        let stepsTaken = 0;

        let playerX = 0;
        let playerY = 0;
        let currentMob = null;
        let worldMap = [];

        // Game Enemy Catalog
        const mobs = [
            { name: "SKELETON", hp: 3, dmg: 1, reward: 1, sprite: "🏹" },
            { name: "ZOMBIE", hp: 4, dmg: 1, reward: 1, sprite: "🧟" },
            { name: "CREEPER", hp: 5, dmg: 2, reward: 2, sprite: "💥" },
            { name: "ENDERMAN", hp: 6, dmg: 2, reward: 3, sprite: "👁️" }
        ];

        const logBox = document.getElementById('log');

        function addLog(text, color = '#aaa') {
            logBox.innerHTML += `<div style="color: ${color}; margin-bottom:4px;">> ${text}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function renderHearts() {
            const container = document.getElementById('hearts-box');
            container.innerHTML = '';
            document.getElementById('dmg-label').innerText = `ATK: 1-6 (+${bonusDamage}) | HP POOL`;
            for(let i=0; i<maxHp; i++) {
                let heartHtml = i < hp ? '<div class="heart"></div>' : '<div class="heart empty"></div>';
                container.innerHTML += heartHtml;
            }
        }

        function createGridUI() {
            const gridEl = document.getElementById('map-grid');
            gridEl.innerHTML = '';
            for(let y=0; y<5; y++) {
                for(let x=0; x<5; x++) {
                    const cellType = worldMap[y][x];
                    const cell = document.createElement('div');
                    cell.className = `cell ${cellType}`;
                    
                    if(x === playerX && y === playerY && hp > 0) {
                        cell.innerHTML = "🧙";
                    } else {
                        if(cellType === 'mob') cell.innerHTML = "👾";
                        if(cellType === 'tunnel') cell.innerHTML = "░";
                        if(cellType === 'heal') cell.innerHTML = "❤️";
                        if(cellType === 'chest') cell.innerHTML = "📦";
                    }
                    
                    gridEl.appendChild(cell);
                }
            }
        }

        function resetWorldMap() {
            playerX = 0;
            playerY = 0;
            
            worldMap = [];
            for(let y=0; y<5; y++) {
                worldMap.push(new Array(5).fill('unexplored'));
            }
            worldMap[playerY][playerX] = 'tunnel';
            createGridUI();
        }
        function movePlayer() {
            if (hp <= 0) return;

            stepsTaken++;
            playerX++;
            if(playerX >= 5) {
                playerX = 0;
                playerY++;
            }

            if(playerY >= 5) {
                addLog("🎉 LEVEL CLEAR! Cavern shaft cleared. +5 Emeralds, +10 Gold!", "#55ff55");
                runEmeralds += 5;
                runGold += 10;
                document.getElementById('run-emeralds').innerText = runEmeralds;
                document.getElementById('run-gold').innerText = runGold;
                resetWorldMap();
                return;
            }

            let baseMobWeight = 0.33; 
            let difficultyMultiplier = baseMobWeight + (stepsTaken * 0.025);
            let finalMobChance = Math.min(0.75, difficultyMultiplier);

            let randomRoll = Math.random();
            
            // Significant balance adjustment: Chest room spawn weight lowered down to 1.5% chance (0.015)
            let chestChance = 0.015;

            if (randomRoll < chestChance) {
                worldMap[playerY][playerX] = 'chest';
                createGridUI();
                openChestCardZone();
            }
            else if (randomRoll < chestChance + finalMobChance) {
                worldMap[playerY][playerX] = 'mob';
                createGridUI();
                spawnMonster();
            } 
            else if (randomRoll < chestChance + finalMobChance + 0.12) {
                worldMap[playerY][playerX] = 'heal';
                createGridUI();
                triggerHealingRoom();
            } 
            else {
                worldMap[playerY][playerX] = 'tunnel';
                addLog("TUNNEL SECURE. Advanced safely deeper into the mine shaft.", '#ffff55');
                createGridUI();
            }
        }

        function openChestCardZone() {
            document.getElementById('explore-btn').disabled = true;
            document.getElementById('chest-zone').style.display = 'block';
            addLog("📦 DUNGEON CHEST DISCOVERED! Found lost card blueprints.", "#ffaa00");

            const cardPool = [
                { type: 'dmg', title: 'SHARPNESS', desc: '+2 Sword Strike Atk', val: 2 },
                { type: 'hp', title: 'VITALITY', desc: '+2 Max Heart Cap', val: 2 },
                { type: 'gold', title: 'FORTUNE', desc: 'Claim +15 Gold Ingots', val: 15 }
            ];

            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            cardPool.forEach(card => {
                let cardEl = document.createElement('div');
                cardEl.className = 'upgrade-card';
                cardEl.innerHTML = `<div class="card-title">${card.title}</div><div class="card-desc">${card.desc}</div>`;
                cardEl.onclick = () => selectCardPerk(card);
                container.appendChild(cardEl);
            });
        }

        function selectCardPerk(card) {
            if (card.type === 'dmg') {
                bonusDamage += card.val;
                addLog(`✨ CARD ACTIVE: Embedded Sharpness! Damage raised permanently by +${card.val}.`, '#55ff55');
            } else if (card.type === 'hp') {
                maxHp += card.val;
                hp += card.val;
                addLog(`✨ CARD ACTIVE: Vitality Infusion! Max heart capacity raised by +${card.val}.`, '#55ff55');
            } else if (card.type === 'gold') {
                runGold += card.val;
                document.getElementById('run-gold').innerText = runGold;
                addLog(`✨ CARD ACTIVE: Fortune Claim! Looted +${card.val} raw Gold Ingots.`, '#ffaa00');
            }

            renderHearts();
            document.getElementById('chest-zone').style.display = 'none';
            document.getElementById('explore-btn').disabled = false;
            createGridUI();
        }

        function triggerHealingRoom() {
            let rateRoll = Math.floor(Math.random() * 100) + 1;
            let healAmount = 1;

            if (rateRoll <= 4) healAmount = 4;
            else if (rateRoll <= 15) healAmount = 3;
            else if (rateRoll <= 40) healAmount = 2;

            hp = Math.min(maxHp, hp + healAmount);
            addLog(`❤️ HEALING FOUNTAIN: Restored ${healAmount} heart(s).`, '#55ff55');
            renderHearts();
            createGridUI();
        }
        function spawnMonster() {
            let roll = Math.floor(Math.random() * mobs.length);
            currentMob = { ...mobs[roll] };

            document.getElementById('explore-btn').disabled = true;
            document.getElementById('combat-zone').style.display = 'block';
            
            document.getElementById('mob-avatar').innerText = currentMob.sprite;
            document.getElementById('mob-title').innerText = `HOSTILE: ${currentMob.name}`;
            updateCombatUI();

            addLog(`⚠️ WARNING: ${currentMob.name} DETECTED IN CHUNK!`, '#ff5555');
        }

        function updateCombatUI() {
            if (currentMob) {
                document.getElementById('mob-stats').innerText = `HP: ${currentMob.hp} | DAMAGE: ${currentMob.dmg}`;
            }
        }

        function attackMob() {
            if (!currentMob || hp <= 0) return;

            let playerRoll = Math.floor(Math.random() * 6) + 1 + bonusDamage;
            addLog(`SWORD STRIKE: HIT FOR ${playerRoll} DAMAGE`, '#55ff55');

            if (currentMob.name === "CREEPER" && playerRoll < currentMob.hp) {
                hp -= 3;
                addLog(`💥 BOOM! Creeper exploded. Suffered 3 hearts damage.`, '#ff5555');
                renderHearts();
                endCombat();
                checkDeath();
                return;
            }

            if (playerRoll >= currentMob.hp) {
                let emeraldGained = currentMob.reward;
                let goldGained = currentMob.reward * 2;

                runEmeralds += emeraldGained;
                runGold += goldGained;

                document.getElementById('run-emeralds').innerText = runEmeralds;
                document.getElementById('run-gold').innerText = runGold;

                addLog(`🎉 REWARD RECLAIMED: +${emeraldGained} Emerald 🟢 | +${goldGained} Gold 🟡`, "#55ff55");
                endCombat();
            } else {
                currentMob.hp -= playerRoll;
                hp -= currentMob.dmg;
                addLog(`💥 TARGET COUNTER-STRIKE: SUFFERED ${currentMob.dmg} DAMAGE`, '#ff5555');
                renderHearts();
                updateCombatUI();
                checkDeath();
            }
        }

        function endCombat() {
            currentMob = null;
            createGridUI();
            document.getElementById('combat-zone').style.display = 'none';
            document.getElementById('explore-btn').disabled = false;
        }

        function checkDeath() {
            if (hp <= 0) {
                hp = 0;
                renderHearts();
                
                vaultEmeralds += runEmeralds;
                document.getElementById('vault-emeralds').innerText = vaultEmeralds;

                addLog(`💀 YOU DIED. Mined Emeralds banked into vault. Run Gold was lost.`, '#ff5555');
                document.getElementById('action-area').innerHTML = `<button class="btn btn-danger" onclick="respawn()">RESPAWN</button>`;
                document.getElementById('combat-zone').style.display = 'none';
            }
        }

        function respawn() {
            hp = 10;
            maxHp = 10;
            bonusDamage = 0;
            runEmeralds = 0;
            runGold = 0;
            stepsTaken = 0;
            
            document.getElementById('run-emeralds').innerText = runEmeralds;
            document.getElementById('run-gold').innerText = runGold;
            document.getElementById('action-area').innerHTML = `<button class="btn btn-action" id="explore-btn" onclick="movePlayer()">Mine Next Chunk</button>`;
            
            renderHearts();
            resetWorldMap();
            addLog(`--- RESPONDING TO CAMP --- Hardcore variables cleared. Cavern map generated.`, '#aaa');
        }

        renderHearts();
        resetWorldMap();
    </script>
</body>
</html>
